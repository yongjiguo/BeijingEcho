<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,600;1,700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #333a42; font-family: Georgia, serif; padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; max-width: 1200px; margin: 0 auto; }
  .cell { text-align: center; }
  .cell svg { width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto; border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .label { color: #e8e0cd; font-size: 15px; margin-top: 10px; letter-spacing: .05em; }
  h1 { color: #f3ecd9; text-align: center; font-size: 20px; font-weight: 400; letter-spacing: .1em; }
</style>
</head>
<body>
<h1>BEIJING ECHO — App Icon Options</h1>
<div class="grid">

<!-- ═══ Option A: classic seal + vertical italic English ═══ -->
<div class="cell">
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grainA"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/><feColorMatrix type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.10 0 0 0 0 0.08 0 0 0 0.06 0"/></filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="#f3ecd9"/>
  <rect width="512" height="512" rx="96" filter="url(#grainA)"/>
  <g transform="translate(280,96) rotate(-2)">
    <rect x="0" y="0" width="180" height="180" rx="20" fill="#b02a1e"/>
    <rect x="0" y="0" width="180" height="180" rx="20" fill="none" stroke="#8c1f16" stroke-width="8"/>
    <rect x="10" y="10" width="160" height="160" rx="12" fill="none" stroke="#f6efdd" stroke-opacity="0.45" stroke-width="3"/>
    <text x="90" y="126" text-anchor="middle" font-family="'Noto Serif SC',serif" font-weight="700" font-size="104" fill="#f6efdd">京</text>
  </g>
  <g transform="translate(232,118) rotate(90)">
    <text x="0" y="0" font-family="'EB Garamond',serif" font-style="italic" font-weight="700" font-size="40" fill="#8a681c" letter-spacing="8">BEIJING ECHO</text>
  </g>
  <rect x="150" y="430" width="40" height="6" rx="3" fill="#a8842c" transform="rotate(-45 170 433)"/>
  <text x="204" y="442" font-family="'EB Garamond',serif" font-weight="600" font-size="20" fill="#6e6449" letter-spacing="6">EST. BEIJING</text>
</svg>
<div class="label">A — Classic Seal · Vertical Italic English</div>
</div>

<!-- ═══ Option B: round badge + arc English ═══ -->
<div class="cell">
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grainB"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/><feColorMatrix type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.10 0 0 0 0 0.08 0 0 0 0.06 0"/></filter>
    <path id="arcB" d="M 96 340 A 160 160 0 0 0 416 340" fill="none"/>
  </defs>
  <rect width="512" height="512" rx="96" fill="#f3ecd9"/>
  <rect width="512" height="512" rx="96" filter="url(#grainB)"/>
  <circle cx="256" cy="240" r="150" fill="#b02a1e"/>
  <circle cx="256" cy="240" r="150" fill="none" stroke="#8c1f16" stroke-width="10"/>
  <circle cx="256" cy="240" r="132" fill="none" stroke="#f6efdd" stroke-opacity="0.4" stroke-width="3"/>
  <text x="256" y="298" text-anchor="middle" font-family="'Noto Serif SC',serif" font-weight="700" font-size="150" fill="#f6efdd">京</text>
  <text font-family="'EB Garamond',serif" font-weight="700" font-size="40" fill="#8a681c" letter-spacing="10">
    <textPath href="#arcB" startOffset="50%" text-anchor="middle">BEIJING ECHO</textPath>
  </text>
  <g fill="#a8842c">
    <rect x="248" y="432" width="8" height="8" rx="1" transform="rotate(45 252 436)"/>
    <rect x="230" y="434" width="6" height="6" rx="1" transform="rotate(45 233 437)"/>
    <rect x="270" y="434" width="6" height="6" rx="1" transform="rotate(45 273 437)"/>
  </g>
</svg>
<div class="label">B — Round Badge · Arc English</div>
</div>

<!-- ═══ Option C: bilingual seal (square stamp, big BEIJING) ═══ -->
<div class="cell">
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grainC"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/><feColorMatrix type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.10 0 0 0 0 0.08 0 0 0 0.06 0"/></filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="#f3ecd9"/>
  <rect width="512" height="512" rx="96" filter="url(#grainC)"/>
  <g transform="translate(256,216) rotate(-2)">
    <rect x="-180" y="-180" width="360" height="360" rx="30" fill="#b02a1e"/>
    <rect x="-180" y="-180" width="360" height="360" rx="30" fill="none" stroke="#8c1f16" stroke-width="12"/>
    <rect x="-164" y="-164" width="328" height="328" rx="18" fill="none" stroke="#f6efdd" stroke-opacity="0.45" stroke-width="5"/>
    <text x="0" y="28" text-anchor="middle" font-family="'Noto Serif SC',serif" font-weight="700" font-size="205" fill="#f6efdd">京</text>
    <rect x="-64" y="66" width="128" height="4" fill="#f6efdd" opacity="0.4"/>
    <text x="0" y="132" text-anchor="middle" font-family="'EB Garamond',serif" font-weight="700" font-size="50" fill="#f6efdd" letter-spacing="18">ECHO</text>
  </g>
  <text x="256" y="470" text-anchor="middle" font-family="'EB Garamond',serif" font-weight="700" font-size="60" fill="#8a681c" letter-spacing="10">BEIJING</text>
</svg>
<div class="label">C — Square Seal · Big BEIJING</div>
</div>

<!-- ═══ Option D: ink ground, modern horizontal ═══ -->
<div class="cell">
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grainD"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/><feColorMatrix type="matrix" values="0 0 0 0 0.9 0 0 0 0 0.86 0 0 0 0 0.78 0 0 0 0.05 0"/></filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="#201a14"/>
  <rect width="512" height="512" rx="96" filter="url(#grainD)"/>
  <g transform="translate(66,156) rotate(-2)">
    <rect x="0" y="0" width="200" height="200" rx="20" fill="#b02a1e"/>
    <rect x="0" y="0" width="200" height="200" rx="20" fill="none" stroke="#8c1f16" stroke-width="8"/>
    <rect x="12" y="12" width="176" height="176" rx="12" fill="none" stroke="#f6efdd" stroke-opacity="0.45" stroke-width="3"/>
    <text x="100" y="142" text-anchor="middle" font-family="'Noto Serif SC',serif" font-weight="700" font-size="116" fill="#f6efdd">京</text>
  </g>
  <text x="378" y="230" text-anchor="middle" font-family="'EB Garamond',serif" font-weight="700" font-size="44" fill="#f3ecd9" letter-spacing="3">BEIJING</text>
  <text x="378" y="296" text-anchor="middle" font-family="'EB Garamond',serif" font-weight="700" font-size="44" fill="#c9a86a" letter-spacing="16">ECHO</text>
  <rect x="326" y="320" width="104" height="2" fill="#a8842c" opacity="0.7"/>
</svg>
<div class="label">D — Ink Ground · Modern Horizontal</div>
</div>

</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #b02a1e; overflow: hidden; }
  svg { display: block; width: 512px; height: 512px; }
</style>
</head>
<body>
<svg id="icon" viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/><feColorMatrix type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.10 0 0 0 0 0.08 0 0 0 0.06 0"/></filter>
  </defs>
  <rect width="512" height="512" fill="#f3ecd9"/>
  <rect width="512" height="512" filter="url(#grain)"/>
  <g transform="translate(256,216) rotate(-2)">
    <rect x="-180" y="-180" width="360" height="360" rx="30" fill="#b02a1e"/>
    <rect x="-180" y="-180" width="360" height="360" rx="30" fill="none" stroke="#8c1f16" stroke-width="12"/>
    <rect x="-164" y="-164" width="328" height="328" rx="18" fill="none" stroke="#f6efdd" stroke-opacity="0.45" stroke-width="5"/>
    <text x="0" y="28" text-anchor="middle" font-family="'Noto Serif SC',serif" font-weight="700" font-size="205" fill="#f6efdd">京</text>
    <rect x="-64" y="66" width="128" height="4" fill="#f6efdd" opacity="0.4"/>
    <text x="0" y="132" text-anchor="middle" font-family="'EB Garamond',serif" font-weight="700" font-size="50" fill="#f6efdd" letter-spacing="18">ECHO</text>
  </g>
  <text x="256" y="470" text-anchor="middle" font-family="'EB Garamond',serif" font-weight="700" font-size="60" fill="#8a681c" letter-spacing="10">BEIJING</text>
</svg>
</body>
</html>
